name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/src/data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (UI + synthetic data for demo mode)
        run: |
          mkdir -p site/data
          cp -r frontend/* site/
          cp backend/src/data/*.json site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
